[mypy]

# Home Assistant 2026.9+ validates with "probatio" and aliases it as
# "voluptuous" at runtime, so the real "voluptuous" package (which may still be
# installed) has the wrong types for Home Assistant's API.
# https://developers.home-assistant.io/blog/2026/09/30/probatio-validation-engine
[mypy-voluptuous.*]
follow_imports = skip
