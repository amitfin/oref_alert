name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Adjust version number
        shell: bash
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"' \
            "${{ github.workspace }}/custom_components/oref_alert/manifest.json"

      - name: Compress the polygons file
        shell: bash
        run: |
          # Replaces the plain file with its .gz version (read by the integration).
          gzip -9 -n "${{ github.workspace }}/custom_components/oref_alert/metadata/area_to_polygon.json"

      - name: ZIP the integration directory
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/oref_alert"
          zip oref_alert.zip -r ./

      - name: Upload the ZIP file to the release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/custom_components/oref_alert/oref_alert.zip
