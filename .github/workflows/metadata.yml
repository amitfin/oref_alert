name: Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  metadata:
    name: Metadata sync
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Set up Python
        uses: ./repo/.github/actions/python
        with:
          packages: aiohttp pyyaml ruff

      - name: Regenerate metadata
        shell: bash
        run: |
          for i in {1..3}; do
            echo "Attempt $i"
            .venv/bin/python repo/scripts/generate_metadata.py && exit 0
            sleep 10
          done
          exit 1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          path: repo
          token: ${{ secrets.MANIFEST_GITHUB_TOKEN }}
          branch: create-pull-request/metadata
          title: Metadata auto-sync
          body: Automated changes by "Metadata" GitHub action
          commit-message: Metadata update

      - name: Enable auto-merge
        if: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --merge ${{ steps.pr.outputs.pull-request-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}