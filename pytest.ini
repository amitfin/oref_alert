[pytest]
asyncio_mode=auto
asyncio_default_fixture_loop_scope=function
# -p no:respx: let Home Assistant install its httpx alias before respx is imported.
addopts=-p no:respx --cov=custom_components/oref_alert --cov-report=term-missing --cov-fail-under=100
filterwarnings=
    ignore::aiohttp.web_exceptions.NotAppKeyWarning:homeassistant\..*
    ignore:Inheritance class HomeAssistantApplication:DeprecationWarning
    ignore::DeprecationWarning:backoff\..*
markers=
    allowed_logs: mark test to expect specific log messages
    slow: marks tests as slow
