[pytest]
asyncio_mode=auto
addopts=--cov=custom_components/oref_alert --cov-report=term-missing --cov-fail-under=100
filterwarnings=
    ignore::aiohttp.web_exceptions.NotAppKeyWarning:homeassistant\..*
    ignore:Inheritance class HomeAssistantApplication:DeprecationWarning
    ignore::DeprecationWarning:backoff\..*
markers=
    allowed_logs: mark test to expect specific log messages
    slow: marks tests as slow